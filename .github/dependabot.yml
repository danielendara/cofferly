version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    groups:
      # eframe, egui_extras and egui_kittest must share one egui version;
      # bumping one alone leaves two egui crates in the tree and breaks the build.
      egui:
        patterns:
          - "egui*"
          - "eframe"
          - "epaint*"
          - "emath"
          - "ecolor"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - github_actions
    commit-message:
      prefix: "ci"
    ignore:
      # This action's tags are Rust versions, not action releases: `@1.99.1` installs Rust
      # 1.99.1. Dependabot reads the highest tag as "newer", so it proposed a non-existent
      # toolchain (1.120.0, PR #277) that fails every job at "Install Rust". Bump Rust by hand:
      # rust-toolchain.toml and every `dtolnay/rust-toolchain@` pin in .github/workflows together.
      - dependency-name: "dtolnay/rust-toolchain"
