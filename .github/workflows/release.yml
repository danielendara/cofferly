name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve release version
        id: resolve-version
        shell: pwsh
        run: |
          $version = "${{ github.ref }}" -replace '^refs/tags/v', ''
          if ("${{ github.ref }}" -notlike 'refs/tags/v*') {
            $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          }
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not resolve release version" }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package portable zip
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ steps.resolve-version.outputs.version }}" -SkipBuild

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements --disable-interactivity
          $iscc = @(
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after Inno Setup install" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile Windows installer
        shell: pwsh
        run: |
          & "$env:ISCC" "/DMyAppVersion=${{ steps.resolve-version.outputs.version }}" installer\Cofferly.iss
          Get-ChildItem dist\*.exe

      - name: Upload portable + installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Cofferly-windows-x64
          path: |
            dist/*.zip
            dist/*Setup.exe

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
