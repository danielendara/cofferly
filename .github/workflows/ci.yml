name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for a public repo. Jobs that need more must opt in.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Block tracked vaults / env files
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/check-vault-paths.sh
          ./scripts/check-vault-paths.sh

      - name: Docs self-check
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/check-docs.sh
          ./scripts/check-docs.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -- --check

      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install Linux GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        run: |
          # Modest floor vs 2026-09-05 baseline of 76.11% line coverage
          # (rustc 1.98.1) after excluding UI-only views.rs (~2% covered)
          # and maintainer screenshot capture.rs (0%). Those files dominate
          # uncovered lines (~54% overall) and would hide a drop in money,
          # story unlock, or ledger tests.
          ignore='(^|/)src/(views|capture)\.rs$'
          cargo llvm-cov --locked --html --output-dir coverage \
            --ignore-filename-regex "$ignore"
          cargo llvm-cov report --lcov --output-path coverage/lcov.info \
            --ignore-filename-regex "$ignore"
          cargo llvm-cov report --fail-under-lines 74 \
            --ignore-filename-regex "$ignore"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/html
          if-no-files-found: warn
          retention-days: 14

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Advisory ignores: `.cargo/audit.toml` (keep `ignore:` below in sync if you use the action input).
      - name: cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
