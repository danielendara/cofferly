[package]
name = "cofferly"
version = "0.4.0"
edition = "2021"
description = "Cofferly - a simple local allowance wallet for kids."
license = "MIT"
repository = "https://github.com/danielendara/cofferly"

[[bin]]
name = "Cofferly"
path = "src/main.rs"

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
eframe = { version = "0.37", features = ["persistence"] }
# Not used directly: egui 0.37 made the bundled emoji/symbol fonts opt-in, and eframe
# does not forward the feature. Without it ○ and ⚠ render as tofu. (● comes from the
# Hack fallback added in theme::configure_style, not from this feature.)
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
opener = "0.9"
rand = "0.10"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zeroize = { version = "1", features = ["alloc"] }

[dev-dependencies]
egui_kittest = { version = "=0.37.0", features = ["eframe"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true

